<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HolidayFinder</title>
   
<style>

    body {
       
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: black;
    }

    /* Style for the video to make it cover the full screen */
    video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* This makes sure the video covers the entire screen  */
    }

    /* Center the circular button with the link */
    .link-button {
        position: absolute;
        top: 80%;
        left: 20%;       
        padding: 20px;
        background-color: black; 
        border-radius: 20px;
        color: white;
        font-size: 20px;
        text-align: center;
        text-decoration: none;
        font-weight: bold;
        
    }

    
    .link-button:hover {
        background-color: rgba(255, 165, 0, 0.8); /* Change color on hover */
    }
</style>

</head>
<body>


<video autoplay muted loop>
    <source src="videos/5244495_Swimming Pool_Swimming_3840x2160.mp4" type="video/mp4">
    
</video>


<a href="pages/home.html" class="link-button">Plan Your Vacation</a>








</body>
</html>
